# Shared job setup: show the CPU features bu needs, then install the toolchain
# and the tools the integration tests call. Runs after actions/checkout.
name: Set up the bu toolchain
description: Print the CPU flags bu needs at runtime and install clang, lld, CMake, Ninja and the test tools.
runs:
  using: composite
  steps:
    # bu requires the CPU's AES + carry-less-multiply extensions at runtime:
    # on x86-64 AES-NI, PCLMUL and AVX (BLAKE3 also uses SSE4.1/AVX2/AVX-512
    # when present); on aarch64 the ARMv8 Crypto Extensions, AES and PMULL
    # (BLAKE3 uses NEON, which is baseline). GitHub-hosted runners have them;
    # if a runner does not, this step says so instead of a test failing later
    # with a less obvious message. The feature list lives in /proc/cpuinfo
    # under "flags" on x86-64 and "Features" on aarch64.
    - name: CPU features
      shell: bash
      run: |
        arch="$(uname -m)"
        echo "arch: $arch, cores: $(nproc)"
        case "$arch" in
            x86_64)
                grep -m1 '^model name' /proc/cpuinfo || true
                field=flags; show="aes pclmulqdq avx sse4_1 avx2 avx512f"; need="aes pclmulqdq avx" ;;
            aarch64|arm64)
                show="aes pmull asimd"; need="aes pmull" ;;
            *)
                echo "::error::bu supports x86_64 and aarch64; this runner is $arch"; exit 1 ;;
        esac
        field="${field:-Features}"
        flags=" $(grep -m1 "^${field}" /proc/cpuinfo | cut -d: -f2) "
        missing=""
        for f in $show; do
            if [[ "$flags" == *" $f "* ]]; then echo "  $f: yes"; else echo "  $f: no"; fi
        done
        for f in $need; do
            [[ "$flags" == *" $f "* ]] || missing="$missing $f"
        done
        if [ -n "$missing" ]; then
            echo "::error::this runner's CPU lacks$missing, which bu requires at runtime"
            exit 1
        fi

    # libclang-rt-dev holds the sanitizer runtimes (clang only recommends it,
    # so --no-install-recommends would leave it out). openssl generates the
    # test data, sqlite3 drives 04-sqlite, script(1) (bsdutils) gives 06-cli
    # and 09-key a terminal, util-linux has setsid and taskset (13-create-
    # no-hang), procps has pgrep and ps (09-key's Ctrl-Z test).
    # size_report.sh needs gawk (strtonum): Ubuntu's default awk is mawk, and
    # installing gawk makes it the awk alternative.
    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
            clang lld cmake ninja-build openssl sqlite3 bsdutils util-linux procps gawk \
            libclang-rt-dev
        clang --version | head -1
        cmake --version | head -1
